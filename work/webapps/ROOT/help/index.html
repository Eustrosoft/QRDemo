  <body>
    <div><yandex.metrika/></div>
    <div class="background"></div>
    <header>
      <div class="block">
        <div class="header-content">
          <a href="/">
            <div>
              <img
                src="/2025-04-02-03.46/assets/img/logo.jpg"
                alt="logo"
                width="55"
              />
              <span>QR коды для бизнеса</span>
            </div>
          </a>
          <div>
            <svg
              class="menu-toggle"
              id="menuToggle"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 10 10"
              stroke="black"
              stroke-width=".6"
              fill="rgba(0,0,0,0)"
              stroke-linecap="round"
            >
              <path d="M2,3L5,3L8,3M2,5L8,5M2,7L5,7L8,7">
                <animate
                  dur="0.2s"
                  attributeName="d"
                  values="M2,3L5,3L8,3M2,5L8,5M2,7L5,7L8,7;M3,3L5,5L7,3M5,5L5,5M3,7L5,5L7,7"
                  fill="freeze"
                  begin="start.begin"
                />
                <animate
                  dur="0.2s"
                  attributeName="d"
                  values="M3,3L5,5L7,3M5,5L5,5M3,7L5,5L7,7;M2,3L5,3L8,3M2,5L8,5M2,7L5,7L8,7"
                  fill="freeze"
                  begin="reverse.begin"
                />
              </path>
              <rect width="10" height="10" stroke="none">
                <animate
                  dur="2s"
                  id="reverse"
                  attributeName="width"
                  begin="click"
                />
              </rect>
              <rect width="10" height="10" stroke="none">
                <animate
                  dur="0.001s"
                  id="start"
                  attributeName="width"
                  values="10;0"
                  fill="freeze"
                  begin="click"
                />
                <animate
                  dur="0.001s"
                  attributeName="width"
                  values="0;10"
                  fill="freeze"
                  begin="reverse.begin"
                />
              </rect>
            </svg>
            <div class="menu" id="menu">
              <a href="/lk/"><button filled>Войти</button></a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section id="video">
        <div class="video-background"></div>
        <div class="block">
          <div class="video-content">
            <h1 white>Видео-учебник по системе qrdemo.qxyz.ru</h1>
            <video controls poster="/2025-04-02-03.46/logos/logo.svg">
              <source
                src="https://eustrosoft.org/videos/qrdemo/qrdemo.0.1.9.learning.draft2x1.3.mp4"
                type="video/mp4"
              />
              <!--
                    <h1 white><a href="https://youtu.be/Qc1afhEnHV0">(на YouTube ->)</a></h1>
              -->
            </video>
          </div>
        </div>
      </section>
    </main>
    <footer>

                  alt="logo"
                  width="55"
                />
                <div>
                  <h3>QR DEMO</h3>
                  <p>QR-коды для всех</p>
                </div>

            </div>
          </div>
          <div>
            <h3>QR DEMO</h3>

            <a href="/lk/">Вход</a>
          </div>
          <div>

            <a href="https://qxyz.ru" target="_blank"> QXYZ </a>

            <a href="tel:+7(995)116-16-01"> +7(995)116-16-01 </a>
          </div>
        </div>
      </div>
